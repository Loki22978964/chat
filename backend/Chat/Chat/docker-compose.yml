services:
  realtimechat.redis:
    image: redis
    container_name: chat_redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Порт для MassTransit (AMQP)
      - "15672:15672" # Веб-панель керування (Login/Pass: guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
volumes:
  postgres_data: